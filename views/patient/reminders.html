<!-- PATIENT MEDICATION REMINDERS VIEW -->
<div class="page-container">

  <div class="page-header">
    <div>
      <h1 class="page-header-title">Medication Schedule Tracker</h1>
      <p class="page-header-subtitle">Build a healthy routine by keeping daily prescription doses on time</p>
    </div>
    <button class="btn btn-primary" ng-click="openModal()">
      <span class="material-symbols-outlined">add</span>
      <span>Add Prescription</span>
    </button>
  </div>

  <!-- Filter Slot Tabs -->
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
    <button class="btn" ng-class="{'btn-primary': selectedSlotFilter === 'All', 'btn-soft': selectedSlotFilter !== 'All'}" ng-click="selectedSlotFilter = 'All'">
      All Doses
    </button>
    <button class="btn" ng-class="{'btn-primary': selectedSlotFilter === 'Morning', 'btn-soft': selectedSlotFilter !== 'Morning'}" ng-click="selectedSlotFilter = 'Morning'">
      Morning
    </button>
    <button class="btn" ng-class="{'btn-primary': selectedSlotFilter === 'Afternoon', 'btn-soft': selectedSlotFilter !== 'Afternoon'}" ng-click="selectedSlotFilter = 'Afternoon'">
      Afternoon
    </button>
    <button class="btn" ng-class="{'btn-primary': selectedSlotFilter === 'Night', 'btn-soft': selectedSlotFilter !== 'Night'}" ng-click="selectedSlotFilter = 'Night'">
      Night
    </button>
  </div>

  <!-- Loading State Indicator -->
  <loading-spinner message="Loading medication schedule..." ng-if="loading"></loading-spinner>

  <!-- Error State Alert -->
  <div class="state-error" ng-if="!loading && error">
    <span class="material-symbols-outlined">error</span>
    <span ng-bind="error"></span>
  </div>

  <div ng-if="!loading && !error">

    <empty-state icon="medication_liquid" title="No prescriptions for this filter" desc="No medication reminders match the selected time slot." ng-if="(reminders | filter:filterBySlot).length === 0"></empty-state>

    <div class="grid-2" ng-if="(reminders | filter:filterBySlot).length > 0">
      <div class="card" style="display: flex; align-items: center; justify-content: space-between;" ng-repeat="rem in reminders | filter:filterBySlot">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="btn" style="padding: 0.5rem; border-radius: 50%; border: 1px solid var(--surface-border);" ng-class="{'btn-primary': rem.completed, 'btn-soft': !rem.completed}" ng-click="toggleComplete(rem)">
            <span class="material-symbols-outlined" style="font-size: 1.3rem;">{{ rem.completed ? 'check' : 'radio_button_unchecked' }}</span>
          </button>

          <div>
            <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);" ng-style="{'text-decoration': rem.completed ? 'line-through' : 'none', 'opacity': rem.completed ? 0.6 : 1}">
              {{ rem.name }}
            </h3>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">
              <strong>Slot:</strong> {{ rem.slot }} · <em>{{ rem.instruction }}</em>
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <status-pill value="{{ rem.completed ? 'completed' : 'upcoming' }}"></status-pill>
          <button class="btn btn-danger" style="padding: 0.35rem 0.6rem; border-radius: var(--radius-md);" ng-click="deleteReminder(rem)" title="Delete Reminder">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">delete</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Add Reminder Modal -->
  <div class="modal-backdrop" ng-if="isModalOpen">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Add Medication Reminder</h3>
        <button class="btn btn-soft" style="padding: 0.3rem 0.5rem;" ng-click="closeModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form name="remFormNg" ng-submit="addReminder()" novalidate>
        <div class="form-group">
          <label>Medicine Name & Dosage</label>
          <input type="text" class="form-control" placeholder="e.g. Paracetamol 500mg" ng-model="newReminder.name" required/>
        </div>

        <div class="form-group">
          <label>Time of Day Slot</label>
          <select class="form-control" ng-model="newReminder.slot" required>
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Night">Night</option>
          </select>
        </div>

        <div class="form-group">
          <label>Special Instructions</label>
          <input type="text" class="form-control" placeholder="e.g. Take after food with warm water" ng-model="newReminder.instruction"/>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-soft" ng-click="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" ng-disabled="remFormNg.$invalid || submitting">
            <span class="spinner" style="width: 16px; height: 16px; border-width: 2px;" ng-if="submitting"></span>
            <span>{{ submitting ? 'Adding...' : 'Save Reminder' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
