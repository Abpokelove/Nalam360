<!-- ACCESS DENIED SHARED VIEW (CONTENT ONLY) -->
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem; border-color: rgba(220, 38, 38, 0.3); background: var(--error-bg);">
    <span class="material-symbols-outlined" style="font-size: 3.5rem; color: var(--error); margin-bottom: 1rem;">gpp_bad</span>
    <h2 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800; color: var(--error); margin-bottom: 0.5rem;">
      Access Denied
    </h2>
    <p style="font-size: 0.95rem; color: var(--text-main); margin-bottom: 1.75rem;">
      You do not have permission to access this section of the Nalam360 workspace.
    </p>

    <button type="button" class="btn btn-primary" ng-click="goToDashboard()">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Return to My Dashboard</span>
    </button>
  </div>
</div>
