<div class="page-container">

  <div class="page-header">
    <div>
      <h1 class="page-header-title">Doctor Consultation Schedule</h1>
      <p class="page-header-subtitle">Review patient appointments and update consultation statuses</p>
    </div>
  </div>

  <loading-spinner message="Loading appointment schedule..." ng-if="loading"></loading-spinner>

  <div class="state-error" ng-if="!loading && error">
    <span class="material-symbols-outlined">error</span>
    <span ng-bind="error"></span>
  </div>

  <div ng-if="!loading && !error">
    <empty-state icon="event" title="No appointments scheduled" desc="You have no patient appointments booked at this time." ng-if="appointments.length === 0"></empty-state>

    <div class="card" ng-if="appointments.length > 0">
      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Patient Name</th>
              <th>Date & Time</th>
              <th>Village / Center</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="apt in appointments">
              <td>
                <div style="font-weight: 700; color: var(--text-main);">{{ apt.patientName || apt.patient }}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">ID: #{{ apt.id }}</div>
              </td>
              <td>
                <div style="font-weight: 600;">{{ apt.date }}</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">{{ apt.time }}</div>
              </td>
              <td>{{ apt.center || apt.village || 'Primary Center' }}</td>
              <td><status-pill value="{{ apt.status }}"></status-pill></td>
              <td>
                <button class="btn btn-soft" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;" ng-click="cancelAppointment(apt)" ng-if="apt.status === 'confirmed' || apt.status === 'Scheduled'">
                  Cancel Appointment
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
